# Lint and format settings only — this repo isn't a Python package.
# Run everything with: python3 .claude/skills/format-and-lint/scripts/format_and_lint.py

[tool.ruff]
# Device code runs on MicroPython (~3.4 syntax plus f-strings), so keep
# the formatter from emitting newer syntax.
target-version = "py37"
extend-exclude = [
    ".claude/skills/m5-onboard/scripts/vendor", # vendored pyserial
    "buddy/device/burst_frames.py",             # generated by gen_burst_frames.py
    "buddy/device-core2/pet_frames.py",         # generated by gen_pet_frames.py
]

[tool.ruff.lint]
# A deliberately small rule set. Many of ruff's newer and pyupgrade-style
# rules suggest CPython-only APIs that MicroPython lacks (zip(strict=...),
# str.removeprefix, X | None annotations), so they aren't enabled.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "E402", # apps adjust sys.path before importing the bundle's modules
    "B905", # zip(strict=) doesn't exist on MicroPython
]
